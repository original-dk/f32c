[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f32c-python-driver"
version = "0.1.0"
description = "WHEELTEC F32C TTL motor serial driver"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["f32c*"]
